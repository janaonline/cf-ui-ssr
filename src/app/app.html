<!-- <div class="wrapper app-wrapper" [ngClass]="true ? 'mt-4' : ''"> -->
<div class="wrapper app-wrapper">
  <!-- <app-home-header></app-home-header> -->
  <app-header></app-header>

  <router-outlet />
  <!-- <app-feedback-widget></app-feedback-widget> -->

  @if(showReportIssueBtn()) {
  <button class="report-issue" matButton (click)="openDialog()">
    <i class="bi bi-flag"></i>
    &nbsp;Report an issue
  </button>
  }
</div>
<app-footer></app-footer>

@if (loaderService.loading()) {
<div class="spinner"
  style="z-index: 999999; display: flex; flex-direction: column;  position: fixed; top: 0px; bottom: 0px">
  <!-- <div class="row"> -->
  <mat-spinner></mat-spinner>
  <!-- </div> -->
  <div class="row">
    <span class="spinText">Loading...</span>
  </div>
</div>
}
