<h2 mat-dialog-title class="px-3 fw-bold">{{ title }}</h2>

<mat-divider class="py-2"></mat-divider>

@if (isLoading) {
<app-pre-loader></app-pre-loader>
<app-pre-loader></app-pre-loader>
}
<mat-dialog-content class="py-2 mat-typography">
  <p class="text-muted">
    <small>{{ desc }}</small>
  </p>
  <div class="row" style="font-size: 12px">
    @for (field of fields; track $index) {
    <ng-container>
      <div class="col-md-6">
        <mat-form-field [appearance]="'outline'" class="mt-2 small-input compact-input" [formGroup]="userInfo">
          <!-- Label -->
          <mat-label for="field.key">
            {{ field.label }}
            @if(field.showAsterisk) {
            <span class="text-danger">
              <sup>*</sup>
            </span>
            }
          </mat-label>

          <!-- input box -->
          <input matInput [formControlName]="field.key" [id]="field.key" [type]="field.formFieldType" />
          @for (validation of field.validations; track $index) {
          <!-- validations -->
          <ng-container ngProjectAs="mat-error">
            @if (hasError(field.key, validation.name)) {
            <mat-error>
              {{ validation.message }}
            </mat-error>
            }
          </ng-container>
          }
          <!-- <ng-container *ngFor="let warning of warnings">
            <mat-hint
              *ngIf="hasWarning(field.key, warning)"
              class="warning-hint"
            >
              {{ warning.message }}
            </mat-hint>
          </ng-container> -->
        </mat-form-field>
      </div>
    </ng-container>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions class="px-5 mb-3 row justify-content-center gap-3">
  <button type="button" class="col-auto py-2 btn btn-cfPrimary" (click)="submitUserInfo()"
    [disabled]="userInfo.invalid">
    Submit
  </button>
  <button mat-dialog-close type="button" class="col-auto py-2 btn btn btn-outline-cfPrimary">
    Cancel
  </button>
</mat-dialog-actions>
