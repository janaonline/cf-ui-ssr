<div class="d-flex my-4 overflow-x-auto">
  @for (btn of buttons(); track $index) {
  <button
    role="button"
    class="btn rounded-3 m-2 text-nowrap font-bold py-1 px-2"
    [class.btn-cfSecondary]="selectedBtnKey() === btn.key"
    [class.btn-outline-cfSecondary]="selectedBtnKey() !== btn.key"
    (click)="buttonClick(btn.key)"
  >
    {{ btn.label }}
  </button>

  }
</div>
