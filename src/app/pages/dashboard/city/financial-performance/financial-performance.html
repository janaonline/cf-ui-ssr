<section class="container">
    <!-- Main Buttons -->
    <app-tab-buttons [buttons]="buttons" (selectedButtonKeyChange)="onSelectedButtonChange($event)">
    </app-tab-buttons>


    <div class="row justify-content-between my-4 position-relative">
        <div class="d-flex flex-column col-sm-12 col-lg-8 p-3 mb-2">
            <div class="mb-4">
                <h6 class="fw-bolder">{{ ulbName() }} {{ selectedButton?.label }} </h6>
                <p>Audited financial statements of FY 2019-20, FY 2020-21, unaudited statements of FY 2021-22, City
                    Finance
                </p>
            </div>
            <app-tree-table></app-tree-table>

        </div>
        <div class="d-flex flex-column col-sm-12 col-lg-4 p-3 mb-2">
            <h6 class=" fw-bolder text-center mb-3">Total Expenditure</h6>
            <div style="min-height: 400px;">
                <app-charts [chartConfig]="chartData()"></app-charts>
            </div>
            <div class="d-flex justify-content-end mt-3">
                <button class="takeActionBtn" role="button">
                    <i class="bi bi-download custom-font-size-6"></i>Download
                </button>
            </div>
        </div>
    </div>

</section>
