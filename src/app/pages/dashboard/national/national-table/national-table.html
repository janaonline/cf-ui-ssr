@if (dataSource.length && headers.length && displayedColumns.length) {
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 border rounded my-4">

    @for (item of headers; track $index) {
    <ng-container [matColumnDef]=item.key>
        <th mat-header-cell *matHeaderCellDef class="text-center fw-bold bg-table-header ">{{item.display_name}}
        </th>
        <td mat-cell *matCellDef="let element"> {{element[item.key]}} </td>
    </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
}
