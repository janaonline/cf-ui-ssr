name: Deploy Angular SSR App on Seo

on:
  push:
    branches:
      - main # or your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm ci --force

      - name: 🛠️ Build Angular SSR
        run: npm run build:dev

      - name: 🚀 Deploy to Server via SSH
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/"
          target: "/var/www/html/seo-cicd/cf-ui-ssr"

      - name: 🔄 Restart PM2 on Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html/seo-cicd/cf-ui-ssr
            pm2 reload ecosystem.config.js --only seo-cf-ui-ssr || pm2 start ecosystem.config.js --only seo-cf-ui-ssr
